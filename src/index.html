<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Clone - Lab</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <div class="app-container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="brand">
        <svg viewBox="0 0 24 24" width="32" height="32" fill="#1DB954">
          <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
        </svg>
        <span>Spotify <span>DB</span></span>
      </div>

      <nav class="nav-menu">
        <a href="#" data-vista="inicio.html" class="nav-item activo">
          <span class="icon">⌂</span> Inicio
        </a>
        <a href="#" data-vista="artistas.html" class="nav-item">
          <span class="icon">🎤</span> Artistas
        </a>
        <a href="#" data-vista="canciones.html" class="nav-item">
          <span class="icon">🎵</span> Canciones
        </a>
      </nav>

      <div class="library-box">
        <div class="library-header">
          <span>📚 Tu Biblioteca</span>
          <button class="btn-plus" title="Acceso rápido">+</button>
        </div>
        <div class="playlist-pill">
          <div class="pill-cover gradient-1">♥</div>
          <div>
            <strong>Tus me gusta</strong>
            <small>Playlist • 12 canciones</small>
          </div>
        </div>
        <div class="playlist-pill">
          <div class="pill-cover gradient-2">⚡</div>
          <div>
            <strong>Coding & Redes</strong>
            <small>Playlist • Mix</small>
          </div>
        </div>
      </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="nav-arrows">
          <button class="circle-btn">❮</button>
          <button class="circle-btn">❯</button>
        </div>
        <div class="search-bar">
          <span>🔍</span>
          <input type="text" placeholder="¿Qué quieres escuchar hoy?">
        </div>
        <div class="user-badge">
          <div class="avatar">P</div>
          <span>Pedro</span>
        </div>
      </header>

      <!-- AQUÍ SE INYECTA src/contenido/*.html -->
      <main id="contenedor-principal" class="content-scroll">
      </main>
    </div>
  </div>

  <!-- REPRODUCTOR INFERIOR -->
  <footer class="player-bar">
    <div class="now-playing">
      <div class="album-art gradient-3" id="player-cover">🎵</div>
      <div class="track-meta">
        <strong id="player-title">Selecciona una pista</strong>
        <span id="player-artist">Listo para reproducir</span>
      </div>
      <button class="like-btn" id="btn-like" title="Guardar en favoritos">♡</button>
    </div>

    <div class="player-center">
      <div class="player-controls">
        <button class="ctrl-btn" title="Aleatorio">🔀</button>
        <button class="ctrl-btn" id="btn-prev" title="Anterior">⏮</button>
        <button class="play-pause-btn" id="btn-play" title="Reproducir/Pausar">▶</button>
        <button class="ctrl-btn" id="btn-next" title="Siguiente">⏭</button>
        <button class="ctrl-btn" title="Repetir">🔁</button>
      </div>
      <div class="progress-wrapper">
        <span id="time-current">0:00</span>
        <div class="progress-bar" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span id="time-total">3:45</span>
      </div>
    </div>

    <div class="player-right">
      <span>🔊</span>
      <div class="volume-bar">
        <div class="volume-fill"></div>
      </div>
    </div>
  </footer>

  <script src="javascript/app.js"></script>
</body>
</html>
